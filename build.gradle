// AGP 9 ima Kotlin vgrajen (vtica org.jetbrains.kotlin.android ne deklariramo). Privzeti prevajalnik
// je KGP 2.2.10; novejsega izberemo tako, kot pise v opombah AGP 9: na classpath skripte gradnje.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'
    }
}

plugins {
    id 'com.android.application' version '9.4.1'
}

android {
    namespace = 'si.safeer.tv'
    // compileSdk doloca samo, katere API-je vidi prevajalnik; vedenja aplikacije ne spremeni.
    // targetSdk 36: robovi (Robovi.kt), gumb Nazaj ostane klasicen (enableOnBackInvokedCallback=false).
    // targetSdk 37 je namenoma loceni korak: Android 17 zahteva dovoljenje ACCESS_LOCAL_NETWORK za
    // vsak promet v domacem omrezju (Safeer Link, Cast) in utrdi zvok v ozadju - to rabi svoj preizkus.
    compileSdk = 37

    defaultConfig {
        minSdk = 28
        targetSdk = 36
        versionCode = 228
        versionName = '2.1.119'
    }

    // BuildConfig je privzeto izklopljen; koda ga rabi (DEBUG, razlicica).
    buildFeatures {
        buildConfig = true
    }

    // Dve loceni aplikaciji iz ene kode. Android ju vidi kot dve aplikaciji (svoje ime, ikona,
    // vnos v zaganjalniku, svoje nastavitve in odstranitev); vzdrzujemo pa en izvorni repozitorij.
    flavorDimensions = ['aplikacija']

    productFlavors {
        brskalnik {
            dimension = 'aplikacija'
            applicationId = 'si.safeer.tv'
        }
        os {
            dimension = 'aplikacija'
            applicationId = 'si.safeer.os'
            versionCode = 19
            versionName = '0.4.2'
        }
        // Safeer OS Tablet: ista koda, a za dotik od blizu (tablica), ne za daljinec.
        // V pripravi; televizorja in brskalnika se ne dotika.
        tablica {
            dimension = 'aplikacija'
            applicationId = 'si.safeer.tablet'
            versionCode = 8
            versionName = '0.3.2'
        }
    }

    sourceSets {
        brskalnik {
            manifest.srcFile 'okusi/brskalnik/AndroidManifest.xml'
        }
        os {
            manifest.srcFile 'okusi/os/AndroidManifest.xml'
        }
        tablica {
            manifest.srcFile 'okusi/tablica/AndroidManifest.xml'
            res.srcDirs = ['okusi/tablica/res']
            java.srcDirs = ['src/tablica/kotlin']
            kotlin.srcDirs = ['src/tablica/kotlin']
        }
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/kotlin']
            kotlin.srcDirs = ['src/main/kotlin']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            assets.exclude '**/*.local.*', '**/*auth*', '**/*.png', '**/*.jpg'
        }
    }

    // Vgrajeni Kotlin vzame jvmTarget od tu (kotlin.compilerOptions ni treba nastavljati).
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        storeRelease {
            if (System.getenv('RELEASE_KEYSTORE')) {
                storeFile = file(System.getenv('RELEASE_KEYSTORE'))
                storePassword = System.getenv('RELEASE_KEY_PASS')
                keyAlias = System.getenv('RELEASE_KEY_ALIAS') ?: 'safeer-browser'
                keyPassword = System.getenv('RELEASE_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            signingConfig = System.getenv('RELEASE_KEYSTORE') ? signingConfigs.storeRelease : null
        }
        debug {
            minifyEnabled = false
            signingConfig = null
        }
    }

    lint {
        // Izdaje lint ne ustavi (checkReleaseBuilds false): CI ga pozene kot svoj korak.
        // Obstojeca opozorila so zapisana v lint-baseline.xml; vsaka NOVA napaka ustavi CI.
        abortOnError = true
        checkReleaseBuilds = false
        baseline = file("lint-baseline.xml")
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-datasource:1.11.1'
    implementation 'androidx.webkit:webkit:1.17.0'
    // QR koda v prijavnem oknu Safeer OS (os/PrijavaActivity): samo kodirnik, cista Java, brez Googlovih storitev
    implementation 'com.google.zxing:core:3.5.3'
    // Ed25519 verification for the signed Safeer Threat Intelligence feed (see libs/README.md)
    implementation files('libs/bcprov-ed25519-1.78.1.jar')
    // WebSocket povezava sprejemnika Safeer Cast (knjiznici sta v libs/, gradnja ne rabi omrezja)
    implementation files('libs/okhttp-4.12.0.jar')
    implementation files('libs/okio-jvm-3.6.0.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
