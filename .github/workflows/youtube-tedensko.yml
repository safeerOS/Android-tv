name: YouTube na zvocnik (tedenska sonda)

# »Predvajaj na zvocniku« pri YouTube dobi zvocni tok od YouTuba po odjemalcu InnerTube (YoutubeZvokPravila). YouTube
# odjemalce in pravila (PO token, SABR) pogosto spreminja; ta sonda vsako sredo pove, ali pot se dela. Brez kljucev, samo
# javna posnetka. Ce YouTube IP poganjalca oznaci za robota, sonda samo opozori (tests/YoutubeZvokSonda.kt).

on:
  schedule:
    - cron: '17 2 * * 3'   # sreda 02:17 UTC = 03:17 pozimi, 04:17 poleti (tedenski pregled ob 3:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pripeto na commit (pregled Grok 25, Z8); zeton po checkoutu ni vec v .git/config (koraki prevedejo kodo repozitorija).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Kotlin 1.9.24 in org.json (pripeti kontrolni vsoti, enako kot v Preverbah)
        run: |
          curl -fsSL -o /tmp/kotlinc.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          echo "eb7b68e01029fa67bc8d060ee54c12018f2c60ddc438cf21db14517229aa693b  /tmp/kotlinc.zip" | sha256sum -c -
          unzip -q /tmp/kotlinc.zip -d /tmp
          curl -fsSL -o /tmp/json.jar https://repo1.maven.org/maven2/org/json/json/20180813/json-20180813.jar
          echo "518080049ba83181914419d11a25d9bc9833a2d729b6a6e7469fa52851356da8  /tmp/json.jar" | sha256sum -c -

      - name: Sonda (visitor_id, player VISIONOS, obseg toka)
        run: |
          /tmp/kotlinc/bin/kotlinc -cp /tmp/json.jar src/main/kotlin/si/safeer/tv/os/YoutubeZvokPravila.kt \
            tests/YoutubeZvokSonda.kt -include-runtime -d /tmp/sonda.jar
          java -cp /tmp/sonda.jar:/tmp/json.jar si.safeer.tv.os.YoutubeZvokSondaKt
