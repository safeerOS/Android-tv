name: Gradnja

# Doslej se je ta brskalnik gradil samo na enem prenosniku. Ce bi se gradnja
# pokvarila, tega ne bi opazil nihce do naslednje izdaje.
#
# Ta tek zgradi NEPODPISANA APK-ja (brskalnik in Safeer OS). Podpisni kljuc ostane
# doma in ga tu ni: build.gradle brez spremenljivke RELEASE_KEYSTORE nastavi
# signingConfig na null. Namen ni izdelati paketa za uporabnike, ampak dokazati,
# da se koda prevede in da sta aplikaciji res loceni.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      beta:
        # Naloga 42 F: rocna gradnja bete (-PsafeerBeta=N -> razlicica -beta.N, stikalo »Nov zaganjalnik« na TV).
        # Prazno = navadna gradnja kot doslej. Vrednost preveri build.gradle (1-9999).
        description: 'Stevilka bete (prazno = navadna gradnja)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Naloga 111: vsi preizkusi brez naprave (tests/vse.sh) - prej jih CI ni poganjal in je npr. TcpDnsTest ostal
  # neprevedljiv. Orodja so pripeta s kontrolno vsoto (kotlinc kot pri lastniku, org.json kot na Androidu).
  testi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Orodja za preizkuse (kotlinc 1.9.24, org.json 20240303) s preverbo
        run: |
          mkdir -p "$RUNNER_TEMP/orodja" && cd "$RUNNER_TEMP/orodja"
          curl -fsSL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          echo "eb7b68e01029fa67bc8d060ee54c12018f2c60ddc438cf21db14517229aa693b  kotlinc.zip" | sha256sum -c -
          unzip -q kotlinc.zip
          curl -fsSL -o json-20240303.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          # SHA-256 (prej SHA-1): izracunana iz istega jar z Maven Central, katerega SHA-1 se ujema z objavljenim .sha1.
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  json-20240303.jar" | sha256sum -c -

      # android.jar za preizkuse, ki ga potrebujejo (run_omnibox_tests.sh ga isce v .android-sdk projekta): Android SDK
      # je na sliki ubuntu-24.04 (ANDROID_HOME, platforme android-34 do 37).
      - name: Android SDK za preizkuse
        run: |
          ln -s "$ANDROID_HOME" .android-sdk
          ls .android-sdk/platforms/android-3*/android.jar | head -1

      # STROGO=1: preskocen preizkus (manjkajoce orodje) ustavi tek - v CI so vsa orodja, tiho preskakovanje ni dovoljeno.
      - name: Vsi preizkusi (tests/vse.sh)
        env:
          KOTLINC: ${{ runner.temp }}/orodja/kotlinc/bin/kotlinc
          JSON_JAR: ${{ runner.temp }}/orodja/json-20240303.jar
          STROGO: '1'
        run: bash tests/vse.sh

  apk:
    # APK samo, ce so preizkusi uspeli.
    needs: testi
    runs-on: ubuntu-24.04  # ubuntu-latest gre 19. 10.-19. 11. 2026 na 26.04; prehod preizkusimo posebej
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Vhod beta gre prek okolja (ne neposredno v ukaz); brez vhoda (push, pull_request) je gradnja enaka kot prej.
      - name: Nepodpisan APK (brez kljuca)
        env:
          SAFEER_BETA: ${{ github.event.inputs.beta }}
        run: |
          if [ -n "$SAFEER_BETA" ]; then
            ./gradlew --no-daemon assembleRelease "-PsafeerBeta=$SAFEER_BETA"
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Povej, kaj je nastalo
        run: |
          ls -lhR build/outputs/apk/
          test -s build/outputs/apk/brskalnik/release/tv-browser-2-brskalnik-release-unsigned.apk \
            || (echo "APK brskalnika ni nastal" && exit 1)
          test -s build/outputs/apk/os/release/tv-browser-2-os-release-unsigned.apk \
            || (echo "APK Safeer OS ni nastal" && exit 1)

      # Android Lint je zdaj zapora: 455 starih napak je zapisanih v lint-baseline.xml (popravljamo
      # jih postopoma), vsaka NOVA napaka v skupni kodi pa ta tek ustavi. Lint tece na razlicici
      # brskalnika, ker ta vsebuje vso skupno kodo (tudi Safeer OS); okusa os in tablica imata
      # le svoje manifeste.
      - name: Android Lint (nove napake ustavijo tek)
        run: ./gradlew --no-daemon lintBrskalnikRelease

      - name: Loceni aplikaciji (si.safeer.tv in si.safeer.os)
        run: |
          python3 tests/preveri_loceni_aplikaciji.py \
            build/outputs/apk/brskalnik/release/tv-browser-2-brskalnik-release-unsigned.apk \
            build/outputs/apk/os/release/tv-browser-2-os-release-unsigned.apk

      - name: Shrani za pregled
        uses: actions/upload-artifact@v7
        with:
          name: nepodpisan-apk
          path: build/outputs/apk/*/release/*.apk
          retention-days: 7
