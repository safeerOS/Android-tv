name: Preverbe

# Prve samodejne preverbe za ta repozitorij. Tecejo brez Android SDK, zato so
# gotove v nekaj sekundah in nic ne stanejo.
#
#  1. prevodi  -- jezik, ki zaostaja za privzetim, bi uporabniku pokazal prazno
#                 polje ali slovenscino. To smo doslej iskali rocno.
#  2. zaznavalnika -- sivi plakat pred videom in dvojna oznaka fokusa sta bila
#                 popravljena; ta preverba pazi, da zaznavalnika, s katerima ju
#                 merimo na televizorju, se vedno prepoznata pravi posnetek
#                 zaslona pred popravkom. Ce kdo zaznavalnik omehca, pade.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preverbe:
    runs-on: ubuntu-24.04  # ubuntu-latest gre 19. 10.-19. 11. 2026 na 26.04; prehod preizkusimo posebej
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Vsak jezik mora imeti vse kljuce
        run: python3 tools/preveri-prevode.py .

      - name: Kotlin 1.9.24 (ista razlicica kot doma, pripeta kontrolna vsota)
        run: |
          curl -fsSL -o /tmp/kotlinc.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          echo "eb7b68e01029fa67bc8d060ee54c12018f2c60ddc438cf21db14517229aa693b  /tmp/kotlinc.zip" | sha256sum -c -
          unzip -q /tmp/kotlinc.zip -d /tmp

      - name: Pravila blokiranja in skrivanja (motor brez Androida)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: bash tools/preveri-motor.sh

      # Jedro Scita: nabor domen in paketi DNS. Tu se lovijo napake v obravnavi
      # odgovorov, ki bi jih na televizorju opazili sele kot cudno delujoc splet.
      - name: Jedro Safeer Scita (nabor domen, paketi DNS)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: bash tests/run_scit_tests.sh

      # Vsi ostali preizkusi v JVM (od kroga 27 obvezni): Hub in seznanjanje SPAKE2 (tudi preklic
      # prijave), tokovi, podpisani seznami groženj, pravila groženj, domene, blokiranje oglasov
      # in pravila Safeer OS (varne mere ikon, vrstica Nadaljuj). Prej so tekli samo doma.
      - name: Safeer OS (mere ikon, vrstica Nadaljuj, kartica Zaslon)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: bash tests/run_os_tests.sh

      - name: Hub, usmerjevalnik in seznanjanje (SPAKE2, preklic prijave)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: |
          bash tests/run_hub_tests.sh
          # org.json je na Androidu vgrajen; na JVM ga pripnemo (ista razlicica kot v Gradlu, preverjena vsota).
          curl -fsSL -o /tmp/json.jar https://repo1.maven.org/maven2/org/json/json/20180813/json-20180813.jar
          echo "518080049ba83181914419d11a25d9bc9833a2d729b6a6e7469fa52851356da8  /tmp/json.jar" | sha256sum -c -
          JSON_JAR=/tmp/json.jar bash tests/run_usmerjevalnik_tests.sh
          JSON_JAR=/tmp/json.jar bash tests/run_data_transport_tests.sh

      - name: Tokovi Huba (zaslon, datoteke)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
          JSON_JAR: /tmp/json.jar
        run: bash tests/run_tokovi_tests.sh

      # Internet prek telefona: katere cilje in vrata telefon odpre, po kateri poti, in racun pretoka
      # (okna, potrditve, ponovitev potrditve). Napaka tu bi se doma pokazala kot prenos, ki obstane.
      - name: Internet prek telefona (poti, cilji, pretok) in izbira poti
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: bash tests/run_gateway_tests.sh

      - name: Podpisani seznami in pravila groženj
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: |
          bash tests/run_signed_feed_tests.sh
          bash tests/run_threat_policy_tests.sh

      - name: Domene in blokiranje oglasov
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: |
          bash tests/run_domene_tests.sh
          bash tests/run_adblock_tests.sh

      # Pravila strani v brskalniku in zvocnika v omrezju (DLNA): kdaj se zvocniku sme poslati preskok, kdaj je
      # ustavljen zvocnik konec skladbe in kdaj ga je prevzel kdo drug. Do kroga 121 so tekla samo doma.
      - name: Most strani, ikone strani, zvocnik v omrezju
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: bash tests/run_splet_tests.sh

      # Skripta, ki jo vgrajeni brskalnik na YouTubu zazene pred skriptami strani (posnetek brez cakanja na oglas).
      # Tece v Node (na tem poganjalcu je ze namescen) z nadomestki za okno, dokument in zgodovino.
      - name: YouTube v vgrajenem brskalniku (zacetek brez cakanja)
        run: node tests/youtube_zacetek_test.js

      # Cistilec oglasnih prekrivk ne sme odstraniti predvajalnika (stanje oglasa je razred na njegovem vsebniku).
      - name: Cistilec oglasnih prekrivk (predvajalnik ostane)
        run: node tests/cistilec_prekrivk_test.js

      # Stran Safeer Linka v aplikacijah za Android: telefon in tablica nista televizor (ikona in napis te naprave),
      # ikone drugih naprav po platformi, ki jo naprava pove sama. Stran se zares izvede (Node, nadomestni elementi).
      - name: Stran Safeer Linka (ikone in napis naprav)
        run: node tests/link_stran_naprave_test.js

      # Vgrajeni brskalnik v Safeer OS: LEVO odpre stransko vrstico samo na levem robu strani (prej ob vsakem pritisku).
      - name: Levi rob strani in stranska vrstica (daljinec)
        run: node tests/tv_levi_rob_test.js
